services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: vehiclete-api-dev
    ports:
      - '8001:8001'
    volumes:
      - ./api:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - mongo
    networks:
      - vehiclete-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: vehiclete-client-dev
    ports:
      - '5173:5173'
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - vehiclete-net
